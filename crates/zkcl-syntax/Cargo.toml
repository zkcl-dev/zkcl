[package]
name = "zkcl-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Lossless Common Lisp syntax and source snapshots for zkcl"

[features]
default = ["analysis"]
analysis = ["dep:salsa", "dep:pulldown-cmark", "dep:zkcl-pattern"]

[dependencies]
zkcl-diagnostics.workspace = true
hashbrown = { version = "0.14", default-features = false }
memchr = "2"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
rowan = "0.17.0"
rustc-hash = "2.1"
salsa = { version = "0.28.5", default-features = false, features = ["inventory", "macros"], optional = true }
thiserror.workspace = true
zkcl-target.workspace = true
zkcl-pattern = { workspace = true, optional = true }

[lints]
workspace = true
