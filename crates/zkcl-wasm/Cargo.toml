[package]
name = "zkcl-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Core WebAssembly loading and code generation for zkcl"

[features]
default = ["engine"]
engine = ["dep:postcard", "dep:serde", "dep:wasmparser", "dep:zkcl-bytecode"]
codegen = ["abi", "dep:wasmparser", "dep:wasm-encoder", "dep:zkcl-opt", "dep:zkcl-vop", "dep:zkcl-target"]
abi = ["dep:postcard", "dep:serde", "dep:zkcl-bytecode"]
# Retired-instruction tally used by the dispatch measurements in
# `designs/wasm-backend.md`. Diagnostic only: one increment per executed
# instruction, never changes behavior, and compiled out of default builds.
step-counter = []

[dependencies]
thiserror.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
wasmparser = { version = "0.239", default-features = false, features = ["std", "validate", "features"], optional = true }
wasm-encoder = { version = "0.239", default-features = false, features = ["std", "wasmparser"], optional = true }
zkcl-bytecode = { workspace = true, optional = true }
zkcl-opt = { workspace = true, optional = true }
zkcl-vop = { workspace = true, optional = true }
zkcl-target = { workspace = true, optional = true }

[dev-dependencies]
wasm-encoder = { version = "0.239", default-features = false }
zkcl-opt = { workspace = true, features = ["operation-samples", "counters"] }

[[bench]]
name = "dispatch"
harness = false
required-features = ["engine"]

[[example]]
name = "run_module"
required-features = ["engine", "abi"]

[lints]
workspace = true
