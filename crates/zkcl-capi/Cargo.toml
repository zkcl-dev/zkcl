[package]
name = "zkcl-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "C embedding API for zkcl"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["asdf-ports", "ffi"]
asdf = ["zkcl/asdf"]
asdf-ports = ["asdf", "zkcl/asdf-ports"]
ffi = ["zkcl/ffi"]
delivery = ["zkcl/delivery"]
project = ["delivery", "zkcl/project"]

[dependencies]
smallvec = "1"
serde_json = "1"
tempfile = "3"
thiserror.workspace = true
zkcl = { workspace = true, features = ["lexical-patterns"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
