name: Publish crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build packages and show what would be published
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish workspace crates
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi
          python3 -u scripts/publish-crates.py "${args[@]}"
