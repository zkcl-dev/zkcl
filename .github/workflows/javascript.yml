name: JavaScript backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exercise the resident runtime and compiler
        run: node --test crates/zkcl-js/tests/*.test.mjs
      - name: Exercise Rust emission and CLI deployment
        run: |
          cargo test --locked -p zkcl-js
          cargo test --locked -p zkcl-cli --no-default-features \
            --test javascript_application --test javascript_method_combinations
